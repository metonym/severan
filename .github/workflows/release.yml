name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Build package
        run: bun run build

      - name: Publish to NPM
        working-directory: dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --provenance --access public

      # npm can serve a version's metadata minutes before its tarball.
      # Green means `bun add severan@<version>` works: create the GitHub
      # release and bump dependents only after this.
      - name: Wait for the tarball
        run: |
          version=$(jq -r .version package.json)
          url="https://registry.npmjs.org/severan/-/severan-$version.tgz"
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$status" = 200 ]; then echo "$url is live"; exit 0; fi
            echo "$url: $status (attempt $i)"; sleep 10
          done
          echo "$url still isn't live after 10 minutes"; exit 1
